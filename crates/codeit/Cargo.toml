[package]
name = "codeit"
description = "A coding agent for your terminal and your browser"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
codeit-providers.workspace = true
codeit-harness.workspace = true
anyhow.workspace = true
dirs.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
unicode-width.workspace = true
axum.workspace = true
include_dir.workspace = true
futures-util.workspace = true
reqwest.workspace = true
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
async-trait.workspace = true

[features]
# Speech to text in `codeit web`, with whisper.cpp built in (needs cmake, a C++ compiler and libclang).
voice = ["dep:whisper-rs"]
